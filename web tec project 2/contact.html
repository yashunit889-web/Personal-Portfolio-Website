    <section class="page">

        <!-- CHANGE THIS -->
        <h1>Contact Me</h1>


        <!-- Contact Form -->

        <form id="contactForm">


            <!-- CHANGE THIS: Placeholder text -->

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >


            <textarea
                id="message"
                placeholder="Enter your message"
            ></textarea>


            <button type="submit">
                Send Message
            </button>

        </form>


        <!-- JavaScript displays message here -->

        <p id="formMessage"></p>


        <!-- CHANGE THIS: Your contact information -->

        <div class="contact-info">

            <h3>My Contact Information</h3>

            <p>Email: your-email@example.com</p>

            <p>Location: India</p>
